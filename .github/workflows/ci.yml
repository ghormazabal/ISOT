name: ISoT CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Inventario, API y frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el paquete
        run: pip install -e ".[dev]"

      - name: Validar integridad del inventario
        run: python -m isot.validator

      - name: Verificar que el índice está al día
        run: python -m isot.indexer --check

      - name: Patrones prohibidos (anonimización)
        run: python -m isot.leakcheck

      - name: Tests del backend
        run: pytest

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build del frontend
        working-directory: web
        run: |
          npm ci
          npm run build
