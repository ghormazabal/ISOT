name: ISoT CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Inventario, API y frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el paquete
        run: pip install -e ".[dev]"

      - name: Validar el repo de datos de ejemplo
        run: python -m isot.validator --repo examples/demo-repo

      - name: Verificar que sus índices están al día
        run: python -m isot.indexer --check --repo examples/demo-repo

      - name: Acción reutilizable (validate) sobre la demo
        uses: ./.github/actions/validate
        with:
          repo: examples/demo-repo
          install: "false"

      - name: Patrones prohibidos (anonimización)
        run: python -m isot.leakcheck

      - name: Tests del backend
        run: pytest

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tests y build del frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
