# Hooks locales del repo de la herramienta: índices y validador sobre la demo
# (examples/demo-repo) y patrones prohibidos sobre todo el árbol.
repos:
  - repo: local
    hooks:
      - id: isot-generate-index
        name: Generar índices de la demo
        language: python
        additional_dependencies: ["."]
        entry: isot-index --repo examples/demo-repo
        pass_filenames: false
        files: '^examples/demo-repo/'
        always_run: false
      - id: isot-validate
        name: Validar la demo
        language: python
        additional_dependencies: ["."]
        entry: isot-validate --repo examples/demo-repo
        pass_filenames: false
        files: '^examples/demo-repo/'
        always_run: false
      - id: isot-leakcheck
        name: Patrones prohibidos (anonimización)
        language: python
        additional_dependencies: ["."]
        entry: isot-leakcheck
        pass_filenames: false
        always_run: true
