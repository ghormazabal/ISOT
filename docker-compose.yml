services:
  isot:
    build: .
    ports:
      - "8000:8000"
    environment:
      ISOT_ROOT: /app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
