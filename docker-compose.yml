services:
  isot:
    build: .
    ports:
      # Solo en el host local: ISoT no tiene autenticación propia.
      - "127.0.0.1:8000:8000"
    environment:
      # Clon local de tu repositorio de datos, montado en /data. Sin montaje,
      # cambia ISOT_ROOT a /app/examples/demo-repo para ver la demo.
      ISOT_ROOT: /data
      ISOT_HOME: /app
    volumes:
      - ${ISOT_DATA_REPO:-./examples/demo-repo}:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
