[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isot"
version = "0.10.0"
description = "ISoT: Infrastructure Source of Truth (Git-as-a-Database)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Renders (sandbox + StrictUndefined); la sección Renders de la UI depende de él.
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "jsonschema>=4.18",
]
# `isot validate --schemas` / `isot schemas --repo`
schemas = [
    "jsonschema>=4.18",
]

[project.scripts]
isot = "isot.__main__:main"
isot-validate = "isot.validator:main"
isot-index = "isot.indexer:main"
isot-web = "isot.web:main"
isot-leakcheck = "isot.leakcheck:main"

[tool.setuptools.packages.find]
include = ["isot*"]

[tool.setuptools.package-data]
isot = ["forbidden_patterns.json", "rules/k8s_eol.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
