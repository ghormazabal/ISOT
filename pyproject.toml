[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isot"
version = "0.7.0"
description = "ISoT: Infrastructure Source of Truth (Git-as-a-Database)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.scripts]
isot-validate = "isot.validator:main"
isot-index = "isot.indexer:main"
isot-web = "isot.web:main"
isot-leakcheck = "isot.leakcheck:main"

[tool.setuptools.packages.find]
include = ["isot*"]

[tool.setuptools.package-data]
isot = ["forbidden_patterns.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
